<!DOCTYPE html>
<html>

<head>
    <title>Online Job Application Form</title>
</head>

<body>

    <h2>Online Job Application Form</h2>

    <form action="#" method="post" autocomplete="on">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <!-- Full Name -->
            <label>Full Name:</label><br>
            <input type="text" name="fullname" placeholder="Enter Full Name" required minlength="3" maxlength="50" autofocus>
            <br><br>

            <!-- Email -->
            <label>Email:</label><br>
            <input type="email" name="email" placeholder="example@gmail.com" required>
            <br><br>

            <!-- Password -->
            <label>Password:</label><br>
            <input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" maxlength="20" required>
            <br><br>

            <!-- Phone Number -->
            <label>Phone Number:</label><br>
            <input type="tel" name="phone" placeholder="10 Digit Mobile Number" pattern="[0-9]{10}" required>
            <br><br>

            <!-- Date of Birth -->
            <label>Date of Birth:</label><br>
            <input type="date" name="dob" min="1970-01-01" max="2008-12-31" required>
            <br><br>

            <!-- Gender -->
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
            <br><br>

        </fieldset>

        <br>

        <!-- Academic & Professional Details -->
        <fieldset>
            <legend>Academic & Professional Details</legend>

            <!-- Highest Qualification -->
            <label>Highest Qualification:</label><br>
            <input list="qualifications" name="qualification" placeholder="Select or type qualification" required>
            <datalist id="qualifications">
                <option value="High School (10th)">
                <option value="Higher Secondary (12th)">
                <option value="Bachelor's Degree (B.Tech / BCA / B.Sc / B.Com)">
                <option value="Master's Degree (M.Tech / MCA / M.Sc / MBA)">
                <option value="Ph.D.">
            </datalist>
            <br><br>

            <!-- Years of Experience -->
            <label>Years of Experience:</label><br>
            <input type="number" name="experience" min="0" max="40" step="1" placeholder="0" required>
            <br><br>

            <!-- Skills (Checkboxes) -->
            <label>Skills:</label><br>
            <input type="checkbox" id="skill1" name="skills" value="HTML/CSS">
            <label for="skill1">HTML / CSS</label><br>
            <input type="checkbox" id="skill2" name="skills" value="JavaScript">
            <label for="skill2">JavaScript</label><br>
            <input type="checkbox" id="skill3" name="skills" value="Python">
            <label for="skill3">Python</label><br>
            <input type="checkbox" id="skill4" name="skills" value="SQL">
            <label for="skill4">SQL Database</label>
            <br><br>

            <!-- Expected Salary -->
            <label>Expected Salary (Per Annum in ₹):</label><br>
            <input type="number" name="salary" min="100000" max="10000000" step="10000" placeholder="e.g. 500000">
            <br><br>

            <!-- Preferred Job Location -->
            <label>Preferred Job Location:</label><br>
            <input list="locations" name="location" placeholder="Select or search location">
            <datalist id="locations">
                <option value="Mumbai">
                <option value="Pune">
                <option value="Bengaluru">
                <option value="Delhi NCR">
                <option value="Remote / Work From Home">
            </datalist>
            <br><br>

            <!-- Available Joining Date -->
            <label>Available Joining Date:</label><br>
            <input type="date" name="joining_date" required>
            <br><br>

        </fieldset>

        <br>

        <!-- Document Uploads -->
        <fieldset>
            <legend>Document Uploads</legend>

            <!-- Upload Resume -->
            <label>Upload Resume (PDF only):</label><br>
            <input type="file" name="resume" accept=".pdf" required>
            <br><br>

            <!-- Upload Passport Photo -->
            <label>Upload Passport Photo:</label><br>
            <input type="file" name="photo" accept="image/*" required>
            <br><br>

        </fieldset>

        <br>

        <!-- Links & Additional Info -->
        <fieldset>
            <legend>Online Profiles & Cover Letter</legend>

            <!-- LinkedIn Profile -->
            <label>LinkedIn Profile:</label><br>
            <input type="url" name="linkedin" placeholder="https://www.linkedin.com/in/username">
            <br><br>

            <!-- Portfolio Website -->
            <label>Portfolio Website:</label><br>
            <input type="url" name="portfolio" placeholder="https://yourportfolio.com">
            <br><br>

            <!-- Cover Letter -->
            <label>Cover Letter:</label><br>
            <textarea name="cover_letter" rows="5" cols="50" placeholder="Write a brief cover letter or introduction..."></textarea>
            <br><br>

            <!-- Application Completion Status -->
            <label>Form Completion Meter:</label><br>
            <meter value="0.9" min="0" max="1"></meter>
            <br><br>

        </fieldset>

        <br>

        <!-- Declaration Checkbox -->
        <input type="checkbox" id="declaration" name="declaration" required>
        <label for="declaration">I declare that all the information provided above is true and correct to the best of my knowledge.</label>
        <br><br>

        <!-- Action Buttons -->
        <button type="submit">Submit Application</button>
        <button type="reset">Reset Form</button>

    </form>

</body>

</html>
