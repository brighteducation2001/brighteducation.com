<!DOCTYPE html>
<html>

<head>
    <title>Flight Ticket Booking Form</title>
</head>

<body>

    <h2>Flight Ticket Booking Form</h2>

    <form action="#" method="post" autocomplete="on">

        <!-- Passenger Contact & Identification Information -->
        <fieldset>
            <legend>Passenger Details</legend>

            <!-- Passenger Name -->
            <label>Passenger Name:</label><br>
            <input type="text" name="passenger_name" placeholder="Enter Full Name" required autofocus minlength="3" maxlength="40">
            <br><br>

            <!-- Email Address -->
            <label>Email:</label><br>
            <input type="email" name="passenger_email" placeholder="example@domain.com" required>
            <br><br>

            <!-- Phone Number -->
            <label>Phone Number:</label><br>
            <input type="tel" name="passenger_phone" placeholder="10 Digit Phone Number" pattern="[0-9]{10}" required>
            <br><br>

            <!-- Passport Number -->
            <label>Passport Number:</label><br>
            <input type="text" name="passport_number" placeholder="Enter Passport Number" minlength="6" maxlength="12" required>
            <br><br>

            <!-- Upload Passport -->
            <label>Upload Passport (PDF or Image):</label><br>
            <input type="file" name="passport_file" accept=".pdf,image/*" required>
            <br><br>

        </fieldset>

        <br>

        <!-- Flight Itinerary Details -->
        <fieldset>
            <legend>Flight Details</legend>

            <!-- Departure City -->
            <label>From City:</label><br>
            <input list="cities_from" name="from_city" placeholder="Select or type departure city" required>
            <datalist id="cities_from">
                <option value="Mumbai">
                <option value="Delhi">
                <option value="Bengaluru">
                <option value="London">
                <option value="New York">
            </datalist>
            <br><br>

            <!-- Destination City -->
            <label>Destination City:</label><br>
            <input list="cities_to" name="to_city" placeholder="Select or type destination city" required>
            <datalist id="cities_to">
                <option value="Dubai">
                <option value="Singapore">
                <option value="Tokyo">
                <option value="Paris">
                <option value="Sydney">
            </datalist>
            <br><br>

            <!-- Departure Date -->
            <label>Departure Date:</label><br>
            <input type="date" name="departure_date" required>
            <br><br>

            <!-- Return Date -->
            <label>Return Date:</label><br>
            <input type="date" name="return_date">
            <br><br>

            <!-- Number of Passengers -->
            <label>Number of Passengers:</label><br>
            <input type="number" name="passenger_count" min="1" max="10" value="1" required>
            <br><br>

        </fieldset>

        <br>

        <!-- Travel & Seat Preferences -->
        <fieldset>
            <legend>Travel Preferences</legend>

            <!-- Travel Class Selection -->
            <label>Travel Class:</label><br>
            <select name="travel_class" required>
                <option value="" disabled selected>Select Travel Class</option>
                <option value="economy">Economy Class</option>
                <option value="premium_economy">Premium Economy</option>
                <option value="business">Business Class</option>
                <option value="first_class">First Class</option>
            </select>
            <br><br>

            <!-- Meal Preference -->
            <label>Meal Preference:</label><br>
            <input type="radio" id="veg" name="meal_pref" value="vegetarian" required>
            <label for="veg">Vegetarian</label><br>
            
            <input type="radio" id="nonveg" name="meal_pref" value="non_vegetarian">
            <label for="nonveg">Non-Vegetarian</label><br>
            
            <input type="radio" id="vegan" name="meal_pref" value="vegan">
            <label for="vegan">Vegan</label><br>
            
            <input type="radio" id="nomeal" name="meal_pref" value="none">
            <label for="nomeal">No Meal Required</label>
            <br><br>

            <!-- Seat Preference -->
            <label>Seat Preference:</label><br>
            <select name="seat_preference">
                <option value="window">Window Seat</option>
                <option value="aisle">Aisle Seat</option>
                <option value="middle">Middle Seat</option>
                <option value="extra_legroom">Extra Legroom</option>
            </select>
            <br><br>

        </fieldset>

        <br>

        <!-- Payment Method -->
        <fieldset>
            <legend>Payment Details</legend>

            <label>Payment Method:</label><br>
            <input type="radio" id="card" name="payment_method" value="credit_debit" required>
            <label for="card">Credit / Debit Card</label><br>

            <input type="radio" id="upi" name="payment_method" value="upi">
            <label for="upi">UPI / Net Banking</label><br>

            <input type="radio" id="wallet" name="payment_method" value="wallet">
            <label for="wallet">Digital Wallet</label>
            <br><br>

        </fieldset>

        <br>

        <!-- Terms Agreement -->
        <input type="checkbox" name="terms" required>
        I confirm that the details provided are correct and accept the Booking Policy.
        <br><br>

        <!-- Action Button -->
        <button type="submit">Book Ticket</button>
        <button type="reset">Reset Form</button>

    </form>

</body>

</html>
