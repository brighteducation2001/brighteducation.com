<!DOCTYPE html>
<html>

<head>
    <title>HTML5 Admission Form</title>
</head>

<body>

    <h2>College Admission Form (HTML5)</h2>

    <!-- NEW ATTRIBUTES IN <form>: -->
    <!-- action="#": Specifies the URL/destination where form data is sent upon submission (# means current page) -->
    <!-- method="post": HTTP method used to send data securely inside the request body rather than in the URL -->
    <!-- autocomplete="on": Enables the browser to auto-fill previously saved user input values -->
    <form action="#" method="post" autocomplete="on">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label>Full Name</label><br>
            <!-- NEW ATTRIBUTES IN <input>: -->
            <!-- name="fullname": Assigns a unique variable name to identify this field's value when sent to the server -->
            <!-- autofocus: Automatically places the cursor/focus inside this input field when the page loads -->
            <input type="text" name="fullname" placeholder="Enter Full Name" required autofocus>
            <br><br>

            <label>Email</label><br>
            <input type="email" name="email" placeholder="example@gmail.com" required>
            <br><br>

            <label>Password</label><br>
            <input type="password" minlength="8" maxlength="15" required>
            <br><br>

            <label>Confirm Password</label><br>
            <input type="password" required>
            <br><br>

            <label>Phone Number</label><br>
            <input type="tel" pattern="[0-9]{10}" placeholder="10 Digit Mobile Number" required>
            <br><br>

            <label>Date of Birth</label><br>
            <!-- NEW ATTRIBUTES FOR <input type="date">: -->
            <!-- min="1990-01-01" max="2010-12-31": Restricts the calendar picker range between Jan 1, 1990 and Dec 31, 2010 -->
            <input type="date" min="1990-01-01" max="2010-12-31">
            <br><br>

        </fieldset>

        <br>

        <!-- Academic Details -->
        <fieldset>

            <legend>Academic Details</legend>

            <label>Course</label><br>

            <input list="courseList">

            <datalist id="courseList">
                <option value="BCA">
                <option value="B.Tech">
                <option value="B.Sc">
                <option value="B.Com">
                <option value="MBA">
            </datalist>

            <br><br>

            <label>Passing Year</label><br>
            <!-- NEW ATTRIBUTE FOR <input type="number">: -->
            <!-- step="1": Defines the interval/increment size when using the up and down arrow buttons -->
            <input type="number" min="2020" max="2035" step="1">
            <br><br>

            <label>Percentage</label><br>
            <!-- step="0.01": Allows decimal numbers with increments up to two decimal places (e.g., 85.50) -->
            <input type="number" min="0" max="100" step="0.01">
            <br><br>

            <label>Favorite Subject</label><br>
            <input type="search" placeholder="Search Subject">
            <br><br>

        </fieldset>

        <br>

        <!-- Upload Section -->

        <fieldset>

            <legend>Document Upload</legend>

            <label>Upload Photo</label><br>
            <input type="file" accept="image/*">
            <br><br>

            <label>Upload Resume (PDF)</label><br>
            <!-- accept=".pdf": Restricts file chooser selection specifically to files with a .pdf extension -->
            <input type="file" accept=".pdf">
            <br><br>

        </fieldset>

        <br>

        <!-- Other Information -->

        <fieldset>

            <legend>Other Information</legend>

            <label>Website</label><br>
            <input type="url" placeholder="https://example.com">
            <br><br>

            <label>LinkedIn</label><br>
            <input type="url">
            <br><br>

            <label>Favorite Color</label><br>
            <input type="color">
            <br><br>

            <label>Interview Time</label><br>
            <input type="time">
            <br><br>

            <label>Joining Month</label><br>
            <input type="month">
            <br><br>

            <label>Portfolio Week</label><br>
            <!-- type="week": Renders an input control to select a specific week and year (e.g., Week 32, 2026) -->
            <input type="week">
            <br><br>

            <label>Application Progress</label><br>
            <!-- <progress>: Displays a completion progress bar showing task completion status -->
            <!-- value="60" max="100": Represents current completion (60 out of 100) -->
            <progress value="60" max="100"></progress>
            <br><br>

            <label>Profile Strength</label><br>
            <!-- <meter>: Displays a scalar measurement or fractional gauge within a known range (e.g., disk usage, strength) -->
            <!-- value="0.75": Represents the current value (75%) within the default 0 to 1 range -->
            <meter value="0.75"></meter>

        </fieldset>

        <br>

        <!-- Feedback -->

        <fieldset>

            <legend>Feedback</legend>

            <label>Address</label><br>
            <textarea rows="4" cols="40" placeholder="Enter Address"></textarea>
            <br><br>

            <label>Additional Notes</label><br>
            <textarea rows="5" cols="40"></textarea>

        </fieldset>

        <br>

        <input type="checkbox" required>
        I Accept Terms & Conditions

        <br><br>

        <!-- NEW TAG <button>: -->
        <!-- <button type="submit">: Renders a clickable button that triggers form submission (allows HTML inside, like icons/images) -->
        <button type="submit">Submit Application</button>

        <!-- <button type="reset">: Renders a clickable button that resets all form fields to their default state -->
        <button type="reset">Clear Form</button>

    </form>

</body>

</html>
