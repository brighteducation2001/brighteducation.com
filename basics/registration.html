<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <!-- Registration Form Heading -->
    <!-- This heading displays the title of the form -->
    <h2>Student Registration Form</h2>

    <!-- Form Starts Here -->
    <!-- The <form> tag is used to collect user input -->
    <form>

        <!-- Name Input -->
        <!-- Used to enter the user's full name -->
        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your full name"><br><br>

        <!-- Email Input -->
        <!-- Used to enter an email address -->
        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <!-- Password Input -->
        <!-- Password characters are hidden -->
        <label>Password:</label><br>
        <input type="password" placeholder="Enter password"><br><br>

        <!-- Phone Number -->
        <!-- Used to enter a mobile number -->
        <label>Phone Number:</label><br>
        <input type="tel" placeholder="Enter phone number"><br><br>

        <!-- Date of Birth -->
        <!-- Allows the user to select a date -->
        <label>Date of Birth:</label><br>
        <input type="date"><br><br>

        <!-- Gender Selection -->
        <!-- Radio buttons allow only one option -->
        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <!-- Skills -->
        <!-- Checkboxes allow multiple selections -->
        <label>Skills:</label><br>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript
        <input type="checkbox"> Python
        <br><br>

        <!-- Country Dropdown -->
        <!-- Select one country from the list -->
        <label>Country:</label><br>
        <select>
            <option>Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>Canada</option>
            <option>Australia</option>
        </select>
        <br><br>

        <!-- Address -->
        <!-- Multi-line text input -->
        <label>Address:</label><br>
        <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        <!-- Submit and Reset Buttons -->
        <!-- Submit sends the form, Reset clears all fields -->
        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

</body>

</html>
